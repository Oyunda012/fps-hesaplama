function openGame(name){const g=findGame(name);if(!g)return;state.recent=[name,...state.recent.filter(x=>x!==name)].slice(0,8);state.last=name;save();location.hash="game/"+encodeURIComponent(name)}

function setupHome(){return `<div class="page"><div class="ey">İLK KURULUM</div><div class="title">Bilgisayarını tanıt</div><div class="card detail"><div class="aiTitle"><b>🎮 FPS tahminlerini kişiselleştir</b><span class="badge">GEREKLİ</span></div><p class="sub" style="margin-top:8px">Bilgilerini sen gireceksin. Hazır bir bilgisayar profili kullanılmıyor.</p><button class="act primary" id="startSetup" style="width:100%;margin-top:12px">Sistemimi Tanıt</button></div><div class="card grid"><div class="spec"><div class="icon">▣</div><div class="lab">CPU</div><div class="val">Sen gireceksin</div></div><div class="spec"><div class="icon">▤</div><div class="lab">GPU</div><div class="val">Sen gireceksin</div></div><div class="spec"><div class="icon">▥</div><div class="lab">RAM</div><div class="val">Sen gireceksin</div></div><div class="spec"><div class="icon">⌗</div><div class="lab">EKRAN</div><div class="val">Sen gireceksin</div></div></div></div>`}
function home(){if(!state.profile||!state.profile.cpu||!state.profile.gpu||!state.profile.ram)return setupHome();const g=findGame(state.last)||DB[2],f=fps(g),v=verdict(f);return `<div class="page">
<div class="ey">PERFORMANS KONSOLU</div><div style="display:flex;justify-content:space-between;align-items:center;margin:5px 0 14px"><div class="sub">Profil güncellendi • cihaz içinde kayıtlı</div><span class="badge">● Hazır</span></div>
<div class="card hero"><div class="heroCover">${coverArt(g,true)}</div><div class="heroShade"></div><div class="heroTop"><span class="badge">◷ Son kontrol: şimdi</span><span class="badge ok">● ${v[0]}</span></div><div class="heroInfo"><div class="gameTitle">${esc(g.name)}</div><div class="heroRow"><div><div class="muted">${state.profile.res} • ${qualityLabel(state.quality)}</div><div class="note">Yoğun sahnelerde tahmini düşüş: ${Math.max(8,Math.round(f*.82))} FPS civarı.</div></div><div><span class="fps">${f}</span> <span style="font-weight:900;color:var(--cyan)">FPS</span><div class="muted">tahmini ortalama</div></div></div></div></div>
<div class="actions"><button class="act primary" id="homeSettings">☷<b>Ayarları Gör</b></button><button class="act" id="homeSearch">⌕<b>Oyunu Ara</b></button><button class="act" id="homeSystem">▣<b>Sistemini Güncelle</b></button></div>
<div class="head"><h2>Sistem Özeti</h2><button class="link" id="allSystem">Tümünü gör ›</button></div>
<div class="card grid">${spec("▣","GPU",state.profile.gpu)}${spec("▤","CPU",state.profile.cpu)}${spec("▥","RAM",state.profile.ram+" GB")}${spec("⌗","EKRAN",state.profile.res+" ("+state.profile.hz+"Hz)")}${spec("▱","DEPOLAMA","Kayıtlı değil")}${spec("▧","İŞLETİM SİSTEMİ",state.profile.os)}</div>
<div class="head"><h2>Son baktıkların</h2><span class="link">${state.recent.length} kayıt</span></div>
<div class="card">${state.recent.length?state.recent.slice(0,4).map(n=>{const x=findGame(n);return x?gameCard(x):""}).join(""):"<div class='empty'>Henüz oyun açmadın.</div>"}</div>
</div>`}
function spec(i,l,v){return `<div class="spec"><div class="icon">${i}</div><div class="lab">${l}</div><div class="val">${esc(v)}</div></div>`}
function searchPage(){return `<div class="page"><div class="ey">OYUN KÜTÜPHANESİ</div><div class="title">Oyun Ara</div><div class="sub" style="margin:-7px 0 10px">Popüler oyunlarda gerçek kapak görselleri gösterilir. Görsel yüklenemezse otomatik yedek kapak kullanılır.</div><div class="searchBox"><span style="color:var(--cyan);font-size:20px">⌕</span><input id="gameQuery" value="${esc(state.query)}" placeholder="GTA, FIFA, Resident Evil..."><button class="searchBtn" id="unknownAI">✦ AI</button></div>
<div class="chips">${["Tümü",...Array.from(new Set(DB.map(g=>g.genre)))].map(c=>`<button class="chip ${state.cat===c?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
<div class="head"><h2>Sonuçlar</h2><span class="link" id="resultCount"></span></div><div class="card" id="results"></div>
<div class="head"><h2>Katalogda yoksa</h2></div><div class="card ai"><div class="aiTitle"><b>✦ Bilinmeyen oyunu analiz et</b><span class="aiPill">YEREL AI</span></div><p class="sub">Oyun veritabanında olmasa bile sistem profilinden bir ön tahmin ve ayar önerisi oluşturur. İnternet beklemez.</p><button class="act primary" id="analyzeUnknown" style="width:100%">Analiz oluştur</button></div></div>`}
function renderResults(){const q=state.query.trim();let a=DB.filter(g=>state.cat==="Tümü"||g.genre===state.cat);if(q)a=a.map(g=>[g,scoreName(g.name,q)+scoreName(g.genre,q)*.2]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);$("resultCount").textContent=a.length+" oyun";$("results").innerHTML=a.length?a.slice(0,60).map(gameCard).join(""):`<div class="empty">“${esc(q)}” katalogda bulunamadı.<br>Yukarıdaki AI analizini kullanabilirsin.</div>`;bindGames()}
function bindHome(){setClick("homeSettings",openSetup);setClick("homeSearch",()=>nav("search"));setClick("homeSystem",()=>nav("system"));setClick("allSystem",()=>nav("system"));bindGames()}
function bindSearch(){const q=$("gameQuery");if(!q)return;q.oninput=()=>{state.query=q.value;renderResults()};document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x===b));renderResults()});const ai=()=>{const n=q.value.trim();if(!n)return toast("Önce bir oyun adı yaz.");location.hash="ai/"+encodeURIComponent(n)};setClick("unknownAI",ai);setClick("analyzeUnknown",ai);renderResults()}
function gamePage(name){const g=findGame(name);if(!g)return `<div class="page"><div class="card detail"><h2>Oyun bulunamadı</h2><p class="sub">Aramaya dönüp farklı bir ad deneyebilirsin.</p><button class="act primary" style="width:100%" onclick="nav('search')">Oyunu Ara</button></div></div>`;const f=fps(g),v=verdict(f),fav=state.favs.includes(g.name);return `<div class="page"><div class="ey">${esc(g.genre.toUpperCase())} • ${g.year}</div><div class="title">${esc(g.name)}</div><div class="card detail"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="muted">Tahmini performans</div><div><span class="fps" style="font-size:42px">${f}</span> FPS</div></div><button class="pencil" id="favBtn">${fav?"★":"☆"} ${fav?"Favoride":"Favori"}</button></div><div class="head"><h2>Kalite seviyeleri</h2><span class="link">${state.profile.res}</span></div><div class="quality">${["low","medium","high"].map(q=>`<button class="q ${state.quality===q?"on":""}" data-q="${q}"><b>${fps(g,q)}</b><span>${qualityLabel(q)}</span></button>`).join("")}<div class="q"><b>${confidence(g)}%</b><span>Güven</span></div></div><div class="head"><h2>Oynanabilirlik</h2><span class="${v[1]}">${v[0]}</span></div><div class="line"><span>GPU uyumu</span><b>${Math.round(Math.min(100,gpuScore()/2.2*100))}%</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,gpuScore()/2.2*100)}%"></div></div><div class="line"><span>RAM uygunluğu</span><b>${state.profile.ram>=g.recRam?"Yeterli":"Sınırda"}</b></div><div class="bar"><div class="fill ${state.profile.ram>=g.recRam?"green":"orange"}" style="width:${Math.min(100,state.profile.ram/g.recRam*100)}%"></div></div></div>
<div class="head"><h2>Önerilen ayarlar</h2></div><div class="card advice">${advice(g,f)}</div><div class="head"><h2>Donanım notu</h2></div><div class="card detail"><div class="line"><span>Oyunun RAM ihtiyacı</span><b>${g.minram} GB min • ${g.recRam} GB öneri</b></div><div class="line"><span>Profil RAM</span><b>${state.profile.ram} GB</b></div><p class="sub">Bu değerler gerçek benchmark değil, oyun yükü ve donanım sınıfına göre yerel tahmindir. Sürücü, sıcaklık, güç modu ve oyun güncellemeleri sonucu değiştirebilir.</p></div></div>`}
function advice(g,f){if(f>=100)return "Yüksek ayarlarda rahat oynanabilir. FPS dalgalanırsa gölgeleri ve yoğunluk ayarlarını bir kademe düşür.";if(f>=60)return "Yüksek ayar iyi başlangıç. Sabit 60 FPS hedefinde gölgeler, volumetrik efektler ve kalabalık yoğunluğu ilk düşürülecek ayarlar.";if(f>=45)return "Orta ayar önerilir. 60 FPS için gölgeler ve efektleri düşür, çözünürlük ölçeğini gerekirse %90 civarında kullan.";return "Düşük/orta ayar ve daha düşük çözünürlük önerilir. Arka plan uygulamalarını kapatmak ve güç modunu yüksek performansa almak yardımcı olabilir."}
function comparePage(){return `<div class="page"><div class="ey">PERFORMANS KARŞILAŞTIRMA</div><div class="title">İki oyunu karşılaştır</div><div class="two"><div class="card detail"><label class="lab">1. oyun</label><select id="cmp1">${DB.map(g=>`<option>${esc(g.name)}</option>`).join("")}</select></div><div class="card detail"><label class="lab">2. oyun</label><select id="cmp2">${DB.map(g=>`<option>${esc(g.name)}</option>`).join("")}</select></div></div><div class="head"><h2>Sonuç</h2></div><div class="card compare" id="cmpOut"></div></div>`}
function bindCompare(){const a=$("cmp1"),b=$("cmp2");a.value=findGame(state.recent[0])?.name||"Cyberpunk 2077";b.value=findGame(state.recent[1])?.name||"Grand Theft Auto V";const run=()=>{const x=findGame(a.value),y=findGame(b.value),fx=fps(x),fy=fps(y);$("cmpOut").innerHTML=`<table><tr><th></th><th>${esc(x.name)}</th><th>${esc(y.name)}</th></tr><tr><td>FPS</td><td><b style="color:var(--cyan)">${fx}</b></td><td><b style="color:var(--cyan)">${fy}</b></td></tr><tr><td>Kalite</td><td>${qualityLabel(state.quality)}</td><td>${qualityLabel(state.quality)}</td></tr><tr><td>RAM</td><td>${x.recRam} GB öneri</td><td>${y.recRam} GB öneri</td></tr><tr><td>Sonuç</td><td>${verdict(fx)[0]}</td><td>${verdict(fy)[0]}</td></tr></table>`};a.onchange=run;b.onchange=run;run()}
function systemPage(){const p=state.profile;return `<div class="page"><div class="ey">DONANIM PROFİLİ</div><div class="title">Sistemim</div><div class="card profile"><div class="profileTop"><div><div class="lab">Kayıtlı oyuncu profili</div><div class="profileName">${esc(p.name)}</div><div class="verified">● Doğrulanmış profil • yerel kayıt</div></div><button class="pencil" id="editProfile2">✎</button></div></div><div class="head"><h2>Donanım bileşenleri</h2></div><div class="card hw">${hw("İşlemci",p.cpu,"CPU")}${hw("Ekran Kartı",p.gpu,"GPU")}${hw("Bellek",p.ram+" GB DDR4/DDR5","RAM")}${hw("İşletim Sistemi",p.os,"OS")}</div><div class="head"><h2>Ekran ve hedef</h2></div><div class="card grid">${spec("▣","ÇÖZÜNÜRLÜK",p.res)}${spec("↻","YENİLEME HIZI",p.hz+" Hz")}</div><div class="head"><h2>Motor durumu</h2><span class="link">yerel</span></div><div class="card detail"><div class="line"><span>GPU sınıf puanı</span><b>${Math.round(gpuScore()*100)}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,gpuScore()/2.5*100)}%"></div></div><div class="line"><span>CPU sınıf puanı</span><b>${Math.round(cpuScore()*70)}</b></div><div class="bar"><div class="fill green" style="width:${Math.min(100,cpuScore()/1.5*100)}%"></div></div><p class="sub" style="margin-top:10px">FPS motoru cihaz içinde çalışır. Ağ bağlantısı kesilse bile arama, profil ve tahmin ekranları çalışmaya devam eder.</p></div></div>`}
function hw(l,v,t){return `<div class="hwrow"><span><div class="lab">${l}</div><b>${esc(v)}</b></span><span class="tag">${t}</span></div>`}
function aiPage(name){return `<div class="page"><div class="ey">AI PERFORMANS ANALİSTİ</div><div class="title">${esc(name)}</div><div class="card ai"><div class="aiTitle"><b>✦ Yerel analiz motoru</b><span class="aiPill">OFFLINE SAFE</span></div><div id="aiOut" class="aiText">Analiz hazır. İnternet veya harici servis beklemeden çalışır.</div><button class="act primary" id="runAI" style="width:100%;margin-top:10px">✦ Analizi Başlat</button></div><div class="head"><h2>Neden güvenli?</h2></div><div class="card detail"><p class="sub">Bu ekran harici API'ye otomatik bağlanmaz. Böylece açılışta veya oyun aramasında bağlantı beklemesi uygulamayı kilitlemez. İstersen daha sonra ayrı bir AI sunucusu bağlanabilir.</p></div></div>`}
function runLocalAI(name){const g=findGame(name);if(g)return `Oyun katalogda bulundu: ${g.name}\n\nTahmini ${qualityLabel(state.quality)} FPS: ${fps(g)}\nOynanabilirlik: ${verdict(fps(g))[0]}\nGüven: ${confidence(g)}%\n\nÖneri:\n${advice(g,fps(g))}`;const seed=Math.max(1,norm(name).length);const base=35+(seed*7)%35;const est=Math.round(base*gpuScore()*cpuScore()*ramScore()/1.2*resFactor());return `“${name}” katalogda kayıtlı değil.\n\nYerel tahmin: ${Math.max(10,Math.min(180,est))} FPS (${qualityLabel(state.quality)})\nOynanabilirlik: ${verdict(est)[0]}\n\nBu sonuç yaklaşık bir sınıflandırmadır. Oyun motoru, grafik ayarları ve gerçek benchmark verisi bilinmediği için kesin değer olarak kullanılmamalıdır.\n\nÖneri: Önce 1080p Düşük/Orta ayarla başla; gerçek FPS'yi gördükten sonra kaliteyi yükselt.`}
function render(){try{let d="home";try{d=decodeURIComponent(location.hash.slice(1)||"home")}catch(e){}const a=d.split("/"),r=["home","search","system","compare","game","ai"].includes(a[0])?a[0]:"home";const h=r==="search"?searchPage():r==="system"?systemPage():r==="compare"?comparePage():r==="game"?gamePage(a.slice(1).join("/")):r==="ai"?aiPage(a.slice(1).join("/")):home();$("root").innerHTML=h;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.route===r||(r==="game"&&b.dataset.route==="search")||(r==="ai"&&b.dataset.route==="search")));if(r==="home"){bindHome();setClick("startSetup",openSetup);}if(r==="search")bindSearch();if(r==="compare")bindCompare();if(r==="system")setClick("editProfile2",openSetup);if(r==="ai")setClick("runAI",()=>{const o=$("aiOut");if(o)o.textContent=runLocalAI(a.slice(1).join("/"))});if(r==="game"){bindGames();const g=findGame(a.slice(1).join("/"));if(g){setClick("favBtn",()=>{state.favs=state.favs.includes(g.name)?state.favs.filter(x=>x!==g.name):[...state.favs,g.name];save();render()});document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{state.quality=b.dataset.q;save();render()})}}$("boot")?.classList.add("hide")}catch(e){console.error(e);$("boot")?.classList.add("hide");$("root").innerHTML='<div class="page"><div class="card detail"><h2>Güvenli kurtarma</h2><p class="sub">Beklenmeyen bir hata oluştu. Verilerin korunuyor.</p><button class="act primary" style="width:100%" onclick="location.hash=\'home\'">Ana ekrana dön</button></div></div>'}}
function openSetup(){const p=state.profile||DEFAULT;$("fName").value=p.name||"";$("fCpu").value=p.cpu||"";$("fGpu").value=p.gpu||"";$("fRam").value=p.ram||16;$("fRes").value=p.res||"1920x1080";$("fHz").value=p.hz||144;$("fOs").value=p.os||"Windows 11";$("setupModal").classList.add("show")}
function saveProfile(){if(!$('fName')||!$('fCpu')||!$('fGpu'))return;state.profile={name:$('fName').value.trim()||DEFAULT.name,cpu:$('fCpu').value.trim()||DEFAULT.cpu,gpu:$('fGpu').value.trim()||DEFAULT.gpu,ram:Math.max(2,Number($('fRam').value)||16),res:$('fRes').value,hz:Math.max(30,Number($('fHz').value)||144),os:$('fOs').value};save();$('setupModal')?.classList.remove("show");render();toast("Profil kaydedildi")}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="performans-konsolu-profil.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function init(){load();const firstRun=!state.profile;setClick("saveProfile",saveProfile);setClick("closeSetup",()=>$("setupModal")?.classList.remove("show"));setClick("settingsBtn",()=>$("settingsModal")?.classList.add("show"));setClick("closeSettings",()=>$("settingsModal")?.classList.remove("show"));setClick("editProfile",()=>{$("settingsModal")?.classList.remove("show");openSetup()});setClick("exportData",exportData);setClick("importData",()=>$("importFile")?.click());const imp=$("importFile");if(imp)imp.onchange=()=>{const f=imp.files?.[0];if(!f)return;const rr=new FileReader();rr.onload=()=>{try{const x=JSON.parse(rr.result);if(!x||!x.profile)throw Error();state={...state,...x};save();render();toast("Veri içe aktarıldı")}catch(e){toast("Geçersiz yedek dosyası")}};rr.readAsText(f)};setClick("clearData",()=>{if(confirm("Profil, favoriler ve geçmiş silinsin mi?")){try{localStorage.removeItem(STORE)}catch(e){}location.reload()}});setClick("brandBtn",()=>nav("home"));document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.route));render();if(firstRun)requestAnimationFrame(()=>openSetup())}
window.addEventListener("hashchange",()=>requestAnimationFrame(render));
window.addEventListener("error",e=>console.error("App error",e.error||e.message));
try{init()}catch(e){console.error(e);$("boot").classList.add("hide");$("root").innerHTML="<div class='page'><div class='card detail'><h2>Başlatılamadı</h2><p class='sub'>Uygulama güvenli moda geçti. Sayfayı yenileyip tekrar deneyebilirsin.</p></div></div>"}
</script>
<script>
document.addEventListener("error",function(e){
 if(e.target && e.target.tagName==="IMG" && e.target.dataset.game){
   coverFallback(e.target,e.target.dataset.game);
 }
},true);
</script>
<script>
function enhanceGameImages(){
  document.querySelectorAll("img").forEach(function(img){
    if(!img.dataset.game) return;
    if(!img.src || img.src==="about:blank") coverFallback(img,img.dataset.game);
  });
}
</script>

<script>
(function(){
  function markOnline(){
    document.documentElement.dataset.online=navigator.onLine?'1':'0';
    var el=document.getElementById('offlineStatus');
    if(el) el.textContent=navigator.onLine?'● Çevrimiçi':'● Çevrimdışı • Offline mod';
  }
  window.addEventListener('online',markOnline);
  window.addEventListener('offline',markOnline);
  markOnline();
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(e){console.warn('Offline servis kaydı başarısız',e)});
    });
  }
})();
</script>
</body>
